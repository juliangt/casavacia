<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="data:,">
<title>Filtros de dibujo en tiempo real</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/overlay.css">

<!-- Import map: los módulos hacen `import ... from 'three'` y la versión
     de la librería (CDN) se actualiza únicamente aquí. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>

  <canvas id="gl" role="img" aria-label="Vista de cámara con filtros de dibujo"></canvas>

  <!-- playsinline + muted + autoplay: imprescindible para reproducción
       ininterrumpida en iOS Safari y Android Chrome -->
  <video id="cam" playsinline webkit-playsinline muted autoplay
         disablepictureinpicture disableremoteplayback></video>

  <div id="fps" class="hidden" aria-hidden="true">-- fps</div>

  <nav id="filters" class="hidden" aria-label="Selector de filtro"></nav>

  <div id="overlay">
    <div class="card">
      <div id="ov-icon"></div>
      <h1 id="ov-title">Cámara · Bocetos en vivo</h1>
      <p id="ov-text">Convierte la cámara en papel de dibujo: lápiz, blueprint y cómic, procesados en tiempo real en tu GPU.</p>
      <button class="primary" id="ov-btn">Iniciar cámara</button>
      <p class="hint" id="ov-hint">Se pedirá permiso de cámara.<br>Requiere HTTPS (o http://localhost).</p>
    </div>
  </div>

</body>
</html>
